# NAS deployment (Synology Container Manager project "groly"): runs the fork's image built by .github/workflows/docker.yml.
# Host port is 3040 (literal on purpose: the Container Manager wizard cannot read ${VAR} ports for the Web Station step) because 3000 is taken by another container on the NAS; the Web Station portal proxies to http://localhost:3040.
# Put ADMIN_PASSWORD (and the optional VAPID keys) in a .env, and the Watchtower settings in watchtower.env, next to this file, never in git.
services:
  groly:
    image: ghcr.io/doleanj/groly:edge
    ports:
      - "3040:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/app/data/groly.db
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      - ORIGIN=${ORIGIN:-https://groly.nashome}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@groly.local}
      - PUBLIC_VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      # /login is public (200); upstream's /api/auth/me answers 401 when logged out, which marked the container unhealthy.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Pulls a new :edge image after each push to main and restarts only containers labelled above.
  # Notifications go to Synology Chat through the same bridge as the wine-cellar project (see watchtower.env.example).
  watchtower:
    image: nickfedor/watchtower:latest
    # Project file first (notification URL, HOSTNAME, ENDPOINTS), shared secrets file LAST so its token and API switches win.
    # The shared file is generated by synology-chat-webhook/deploy/nas-watchtower-token.sh; never put project settings in it.
    env_file:
      - ./watchtower.env
      - /volume1/docker/secrets/watchtower.env
    ports:
      - "8097:8080"
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-300}
      - WATCHTOWER_NOTIFICATIONS_HOSTNAME=groly
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
